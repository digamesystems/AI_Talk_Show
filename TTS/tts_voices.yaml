# tts_voices.yaml — voice configuration for render_transcript.py
#
# To find voice IDs, run:
#   python -c "
#   from elevenlabs.client import ElevenLabs; import os
#   c = ElevenLabs(api_key=os.environ['ELEVENLABS_API_KEY'])
#   [print(v.voice_id, v.name) for v in c.voices.get_all().voices]
#   "
#
# stability:        0.0–1.0  higher = more consistent, less expressive
# similarity_boost: 0.0–1.0  higher = closer to original voice character
# style:            0.0–1.0  higher = more stylistic expressiveness (v2 models)

voices:
  John:
    voice_id: "onwK4e9ZLuTAKqWW03F9"
    model: eleven_turbo_v2
    stability: 0.5
    similarity_boost: 0.75
    style: 0.0

  Jean:
    voice_id: "pNInz6obpgDQGcFmaJgB"   # aim for: precise, slightly formal
    model: eleven_turbo_v2
    stability: 0.4
    similarity_boost: 0.80
    style: 0.1

  Alan:
    voice_id: "pqHfZKP75CvOlQylNhV4"   # aim for: warm, unhurried, British
    model: eleven_turbo_v2
    stability: 0.6
    similarity_boost: 0.70
    style: 0.0
